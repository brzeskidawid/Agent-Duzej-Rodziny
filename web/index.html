<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Agent Dużej Rodziny</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px -apple-system,Segoe UI,Roboto,sans-serif;background:#f6f7fb;color:#0f172a}a{color:#0ea5e9}</style>
</head>
<body>
  <p>Przenoszę do aplikacji… <a href="app/">Kliknij, jeśli nic się nie dzieje</a>.</p>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) { const regs = await navigator.serviceWorker.getRegistrations(); for (const r of regs) await r.unregister(); }
        if (window.caches) { const keys = await caches.keys(); for (const k of keys) await caches.delete(k); }
      } catch (e) {}
      location.replace('app/');
    })();
  </script>
</body>
</html>
